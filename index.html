  <style>
    :root {
      --slime-color: #38bdf8;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #2e1065 0%, #1e1b4b 45%, #090d16 100%);
      min-height: 100vh;
      color: #f8fafc;
      overflow-x: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 實驗室背景網格與微光 */
    .lab-grid-bg {
      background-image: 
        linear-gradient(to right, rgba(139, 92, 246, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(139, 92, 246, 0.07) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    /* =================================================================
       1. 材料掉入鍋爐的 CSS 動畫 (Drop into Cauldron Animation)
       ================================================================= */
    @keyframes dropIntoCauldron {
      0% {
        transform: translate(var(--start-x, 0px), -170px) scale(0.5) rotate(-25deg);
        opacity: 0;
      }
      18% {
        transform: translate(calc(var(--start-x, 0px) * 0.65), -125px) scale(1.25) rotate(12deg);
        opacity: 1;
      }
      75% {
        transform: translate(calc(var(--start-x, 0px) * 0.1), 15px) scale(1.05) rotate(160deg);
        opacity: 1;
      }
      100% {
        transform: translate(0px, 65px) scale(0.25) rotate(240deg);
        opacity: 0;
      }
    }

    .animate-ingredient-drop {
      animation: dropIntoCauldron 0.68s cubic-bezier(0.45, 0, 0.85, 0.35) forwards;
    }

    /* 材料掉入瞬間的水花飛濺動畫 */
    @keyframes splashExpand {
      0% {
        transform: translate(-50%, -50%) scale(0.3);
        opacity: 0.95;
      }
      60% {
        transform: translate(-50%, -65%) scale(1.35);
        opacity: 0.75;
      }
      100% {
        transform: translate(-50%, -80%) scale(1.8);
        opacity: 0;
      }
    }

    .animate-splash-ring {
      animation: splashExpand 0.55s ease-out forwards;
    }

    /* 鍋爐被材料投入時的輕微彈性下沉回彈 */
    @keyframes cauldronImpactBounce {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      35% { transform: scale(1.05, 0.94) translateY(6px); }
      70% { transform: scale(0.98, 1.03) translateY(-3px); }
    }

    .animate-cauldron-impact {
      animation: cauldronImpactBounce 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* =================================================================
       2. 點擊『開始攪拌』：鍋爐劇烈晃動 3 秒的 CSS 動畫
       ================================================================= */
    @keyframes violentCauldronShake {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
      4%   { transform: translate(-14px, -6px) rotate(-7deg) scale(1.04, 0.96); }
      8%   { transform: translate(15px, 4px) rotate(8deg) scale(0.96, 1.05); }
      12%  { transform: translate(-16px, 6px) rotate(-9deg) scale(1.05, 0.95); }
      16%  { transform: translate(14px, -8px) rotate(7deg) scale(0.95, 1.06); }
      20%  { transform: translate(-18px, -4px) rotate(-10deg) scale(1.07, 0.93); }
      24%  { transform: translate(18px, 7px) rotate(10deg) scale(0.94, 1.07); }
      28%  { transform: translate(-15px, 8px) rotate(-8deg) scale(1.06, 0.94); }
      32%  { transform: translate(16px, -6px) rotate(9deg) scale(0.95, 1.06); }
      36%  { transform: translate(-20px, -5px) rotate(-11deg) scale(1.08, 0.92); }
      40%  { transform: translate(19px, 8px) rotate(11deg) scale(0.92, 1.08); }
      44%  { transform: translate(-17px, -9px) rotate(-9deg) scale(1.06, 0.94); }
      48%  { transform: translate(20px, 5px) rotate(12deg) scale(0.93, 1.08); }
      52%  { transform: translate(-22px, 7px) rotate(-12deg) scale(1.09, 0.91); }
      56%  { transform: translate(21px, -8px) rotate(11deg) scale(0.92, 1.09); }
      60%  { transform: translate(-19px, -6px) rotate(-10deg) scale(1.08, 0.93); }
      64%  { transform: translate(18px, 9px) rotate(10deg) scale(0.94, 1.07); }
      68%  { transform: translate(-21px, 5px) rotate(-11deg) scale(1.08, 0.92); }
      72%  { transform: translate(17px, -7px) rotate(9deg) scale(0.95, 1.06); }
      76%  { transform: translate(-16px, 8px) rotate(-8deg) scale(1.06, 0.94); }
      80%  { transform: translate(15px, -5px) rotate(8deg) scale(0.96, 1.05); }
      84%  { transform: translate(-14px, -4px) rotate(-7deg) scale(1.05, 0.95); }
      88%  { transform: translate(12px, 5px) rotate(6deg) scale(0.97, 1.04); }
      92%  { transform: translate(-10px, -3px) rotate(-5deg) scale(1.03, 0.97); }
      96%  { transform: translate(6px, 2px) rotate(3deg) scale(0.99, 1.02); }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); }
    }

    .animate-cauldron-violent-3s {
      animation: violentCauldronShake 3s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
    }

    /* 鍋爐內部液體波浪與氣泡動畫 */
    @keyframes bubbleRise {
      0% {
        transform: translateY(20px) scale(0.4);
        opacity: 0;
      }
      30% {
        opacity: 0.85;
      }
      100% {
        transform: translateY(-95px) scale(1.25);
        opacity: 0;
      }
    }

    .cauldron-bubble {
      animation: bubbleRise var(--dur, 2.2s) ease-in infinite;
      animation-delay: var(--delay, 0s);
    }

    @keyframes liquidWave {
      0%, 100% { transform: translateX(-4%) rotate(-1deg) scaleY(1); }
      50% { transform: translateX(4%) rotate(1.5deg) scaleY(1.06); }
    }

    .animate-liquid-surface {
      animation: liquidWave 2.6s ease-in-out infinite;
    }

    /* =================================================================
       3. 純 CSS 果凍般 Q 彈、持續蠕動與呼吸的水滴狀史萊姆
          (Pure CSS Jelly Droplet Slime - Continuous Breathe & Wobble)
       ================================================================= */
    @keyframes slimeBreatheAndWobble {
      0% {
        /* 圓潤水滴狀：上方較尖圓、下方飽滿寬闊 */
        border-radius: 50% 50% 46% 54% / 64% 62% 38% 36%;
        transform: scale3d(1, 1, 1) translateY(0px) rotate(0deg);
      }
      20% {
        border-radius: 54% 46% 51% 49% / 58% 66% 34% 42%;
        transform: scale3d(1.07, 0.93, 1) translateY(5px) rotate(1.2deg);
      }
      40% {
        border-radius: 46% 54% 44% 56% / 68% 58% 42% 32%;
        transform: scale3d(0.94, 1.07, 1) translateY(-7px) rotate(-1.5deg);
      }
      60% {
        border-radius: 52% 48% 53% 47% / 56% 60% 40% 44%;
        transform: scale3d(1.09, 0.91, 1) translateY(7px) rotate(1.5deg);
      }
      80% {
        border-radius: 48% 52% 47% 53% / 66% 64% 36% 34%;
        transform: scale3d(0.96, 1.05, 1) translateY(-4px) rotate(-1deg);
      }
      100% {
        border-radius: 50% 50% 46% 54% / 64% 62% 38% 36%;
        transform: scale3d(1, 1, 1) translateY(0px) rotate(0deg);
      }
    }

    /* 玩家點擊史萊姆時的果凍超 Q 彈壓扁回彈動畫 */
    @keyframes slimeJellyPoke {
      0%   { transform: scale3d(1, 1, 1); }
      20%  { transform: scale3d(1.26, 0.74, 1) translateY(16px); }
      40%  { transform: scale3d(0.84, 1.18, 1) translateY(-14px); }
      55%  { transform: scale3d(1.14, 0.87, 1) translateY(8px); }
      70%  { transform: scale3d(0.93, 1.08, 1) translateY(-5px); }
      85%  { transform: scale3d(1.04, 0.96, 1) translateY(2px); }
      100% { transform: scale3d(1, 1, 1) translateY(0); }
    }

    .slime-droplet-body {
      position: relative;
      width: 230px;
      height: 215px;
      background-color: var(--slime-color, #38bdf8);
      /* 多層果凍光學折射：頂部清透高光、中間飽滿色澤、底部深邃果凍立體陰影 */
      background-image: 
        radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.18) 22%, transparent 48%),
        radial-gradient(circle at 70% 78%, rgba(0, 0, 0, 0.28) 0%, transparent 55%),
        linear-gradient(165deg, rgba(255, 255, 255, 0.35) 0%, transparent 45%, rgba(0, 0, 0, 0.25) 100%);
      border-radius: 50% 50% 46% 54% / 64% 62% 38% 36%;
      box-shadow:
        inset 12px 16px 28px rgba(255, 255, 255, 0.65),
        inset -14px -20px 32px rgba(0, 0, 0, 0.32),
        inset 0px -8px 18px rgba(255, 255, 255, 0.35),
        0 20px 45px -8px var(--slime-glow, rgba(56, 189, 248, 0.55)),
        0 6px 20px rgba(0, 0, 0, 0.4);
      animation: slimeBreatheAndWobble 3.4s cubic-bezier(0.42, 0, 0.58, 1) infinite;
      transform-origin: center bottom;
      cursor: pointer;
      transition: background-color 0.6s ease, box-shadow 0.6s ease;
      backdrop-filter: blur(4px);
    }

    /* 透明膠水基底：強化果凍晶瑩剔透感 */
    .slime-base-clear {
      opacity: 0.92;
      box-shadow:
        inset 15px 20px 34px rgba(255, 255, 255, 0.85),
        inset -12px -18px 28px rgba(0, 0, 0, 0.22),
        inset 0px -12px 24px rgba(255, 255, 255, 0.55),
        0 22px 50px -6px var(--slime-glow, rgba(56, 189, 248, 0.65));
    }

    /* 蓬鬆刮鬍泡基底：強化雲朵奶油柔霧感 */
    .slime-base-fluffy {
      background-image: 
        radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.45) 35%, transparent 65%),
        linear-gradient(165deg, rgba(255, 255, 255, 0.55) 0%, transparent 60%, rgba(0, 0, 0, 0.15) 100%);
      box-shadow:
        inset 16px 22px 38px rgba(255, 255, 255, 0.95),
        inset -14px -18px 30px rgba(0, 0, 0, 0.18),
        0 18px 40px -6px var(--slime-glow, rgba(255, 255, 255, 0.5));
    }

    .slime-poke-active {
      animation: slimeJellyPoke 0.65s cubic-bezier(0.25, 1.5, 0.5, 1) forwards !important;
    }

    /* 水滴史萊姆左上角的主水光反射斑點 */
    .slime-Droplet-Specular {
      position: absolute;
      top: 14%;
      left: 19%;
      width: 44px;
      height: 22px;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 50%;
      transform: rotate(-32deg);
      filter: blur(1px);
      pointer-events: none;
    }

    .slime-Droplet-Specular-Small {
      position: absolute;
      top: 28%;
      left: 14%;
      width: 14px;
      height: 14px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      pointer-events: none;
    }

    /* 史萊姆底部隨呼吸縮放的地面投影 */
    @keyframes slimeShadowPulse {
      0%, 100% { transform: scaleX(1) scaleY(1); opacity: 0.55; }
      20%      { transform: scaleX(1.09) scaleY(1.05); opacity: 0.68; }
      40%      { transform: scaleX(0.91) scaleY(0.92); opacity: 0.42; }
      60%      { transform: scaleX(1.12) scaleY(1.08); opacity: 0.72; }
      80%      { transform: scaleX(0.95) scaleY(0.96); opacity: 0.48; }
    }

    .slime-ground-shadow {
      width: 190px;
      height: 28px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.65) 0%, transparent 72%);
      border-radius: 50%;
      animation: slimeShadowPulse 3.4s cubic-bezier(0.42, 0, 0.58, 1) infinite;
    }

    /* 史萊姆眨眼動畫 */
    @keyframes slimeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }

    .slime-eye {
      animation: slimeBlink 4.2s infinite;
    }

    /* 史萊姆內部懸浮添加物微漂浮動畫 */
    @keyframes innerFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(18deg); }
    }

    .slime-inner-particle {
      animation: innerFloat 2.8s ease-in-out infinite;
    }
  </style>
</head>
<body class="lab-grid-bg antialiased selection:bg-fuchsia-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // =========================================================================
    // 🎵 Web Audio API 實驗室與 Q 彈果凍音效合成器（零外部音檔依賴）
    // =========================================================================
    const LabSound = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },
      // 材料丟入鍋爐的「噗通 / 水滴」音效
      playDrop() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.18);
          osc.frequency.exponentialRampToValueAtTime(680, now + 0.32);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.36);
        } catch (e) {}
      },
      // 攪拌鍋爐 3 秒劇烈搖晃冒泡音效
      playStirring3Seconds() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          // 連續產生 12 個咕嚕咕嚕魔法氣泡音，持續 3 秒
          for (let i = 0; i < 12; i++) {
            const start = now + i * 0.24;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = i % 2 === 0 ? 'triangle' : 'sine';
            const baseFreq = 220 + (i * 35) + Math.random() * 120;
            osc.frequency.setValueAtTime(baseFreq, start);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.65, start + 0.18);
            gain.gain.setValueAtTime(0.15, start);
            gain.gain.exponentialRampToValueAtTime(0.008, start + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + 0.22);
          }
        } catch (e) {}
      },
      // 史萊姆合成誕生音效
      playSpawnFanfare() {
        try {
          this.init();
          if (!this.ctx) return;
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const start = this.ctx.currentTime + idx * 0.09;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.2, start);
            gain.gain.exponentialRampToValueAtTime(0.008, start + 0.38);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(start);
            osc.stop(start + 0.4);
          });
        } catch (e) {}
      },
      // 戳史萊姆「ㄉㄨㄞ～」果凍音效
      playJellyBoing() {
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(580, now + 0.12);
          osc.frequency.exponentialRampToValueAtTime(310, now + 0.25);
          osc.frequency.exponentialRampToValueAtTime(460, now + 0.38);
          gain.gain.setValueAtTime(0.26, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.42);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.44);
        } catch (e) {}
      }
    };

    // =========================================================================
    // 🧪 實驗桌三大區材料資料庫 (Bases, Pigments, Additives)

    // =========================================================================
    // 🎨 三原色複選即時混色演算法 (支援紅、黃、藍任意組合)
    // =========================================================================
    function computeMixedColor(selectedPigmentIds, selectedBase) {
      const hasRed = selectedPigmentIds.includes('red');
      const hasYellow = selectedPigmentIds.includes('yellow');
      const hasBlue = selectedPigmentIds.includes('blue');

    // 🤖 Gemini API 設定與智慧提取器

    const DEFAULT_API_KEY = 'AIzaSyDJgkmPC3ZSwPc_Sihyi38pqRwqrHP1-bI';

    const SYSTEM_PROMPT = `你是一個史萊姆圖鑑生成器。玩家會提供基底、顏色與添加物。請根據這些物理條件，發揮創意合成出一隻史萊姆，並以 JSON 格式回傳：{"slimeName": "史萊姆的名字，要很中二或可愛", "appearance": "外觀描述，並請給我一個對應的 HEX 顏色碼", "texture": "摸起來的觸感描述", "specialBehavior": "這隻史萊姆的特殊行為，例如會黏在天花板"}。`;

    function extractHexFromResponse(parsedObj, fallbackHex) {
      const hexRegex = /#([0-9A-Fa-f]{6}|[0-9A-Fa-f]{3})\b/;
      if (!parsedObj || typeof parsedObj !== 'object') return fallbackHex;

      // 優先檢查 appearance 或其他欄位中的 #RRGGBB
      for (const key of ['appearance', 'hexColor', 'color', 'slimeName']) {
        if (typeof parsedObj[key] === 'string') {
          const match = parsedObj[key].match(hexRegex);
          if (match) return match[0].toUpperCase();
        }
      }
      for (const val of Object.values(parsedObj)) {
        if (typeof val === 'string') {
          const match = val.match(hexRegex);
          if (match) return match[0].toUpperCase();
        }
      }
      return fallbackHex;
    }

    // 當離線或 API 異常時的創意保底生成器（確保 100% 永不卡關）
    function generateCreativeFallbackSlime(base, pigments, additives, mixedInfo) {
      const pigmentNames = pigments.length > 0 ? pigments.map(p => p.name).join('+') : '透明無染';
      const additiveNames = additives.length > 0 ? additives.map(a => a.name).join('與') : '純淨零雜質';
      const namePrefixes = ['深淵星穹・', '禁忌煉金・', '超次元ㄉㄨㄞㄉㄨㄞ・', '宇宙軟萌・', '量子果凍・'];
      const nameSuffixes = ['幻影史萊姆王', '星塵果凍獸', '棉花糖小妖精', '混沌黏黏怪', '極光水滴龍'];
      const pickPrefix = namePrefixes[(base.name.length + pigments.length) % namePrefixes.length];
      const pickSuffix = nameSuffixes[(additives.length + pigments.length * 2) % nameSuffixes.length];

      return {
        slimeName: `${pickPrefix}${base.name.slice(0, 2)}${pickSuffix}`,
        appearance: `通體散發著迷人的【${mixedInfo.name}】光澤（代表色碼：${mixedInfo.hex}），內部懸浮著${additiveNames}，每次呼吸都會折射出果凍般的奇幻炫光！`,
        texture: `結合了「${base.name}」的基底特性，剛摸下去冰涼軟Q，揉捏時帶有${additives.length > 0 ? additiveNames + '的豐富顆粒層次感' : '極致絲滑的果凍回彈感'}，讓人一捏就停不下來！`,
        specialBehavior: `喜歡在半夜偷偷爬到螢幕邊緣隨著音樂節奏晃動，遇到喜歡的創造者時會把身體攤成愛心形狀並吐出閃亮泡泡！`,
        hexColor: mixedInfo.hex
      };
    }

        const userPromptText = `玩家在『瘋狂史萊姆實驗室』選擇的合成配方如下：

請根據這些物理條件，發揮創意合成出一隻史萊姆，並在 appearance 欄位中提供外觀描述與一個對應的 6 碼 HEX 顏色碼（例如 ${mixedInfo.hex}）。請嚴格以 JSON 格式回傳：

        // 優先嘗試直接呼叫 Gemini REST API (支援多個模型自動切換)
        const cleanKey = (apiKey || DEFAULT_API_KEY).trim();
        const modelsToTry = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];

        for (const modelName of modelsToTry) {
          try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(cleanKey)}`;
            const response = await fetch(url, {

                        </div>
                      </div>
                    </div>

                    {/* 史萊姆底部呼吸陰影 */}
                    <div className="slime-ground-shadow -mt-2 z-0" />

                    {/* 色碼與基底標籤 */}
                    <div className="mt-5 flex items-center gap-2 z-10">
                      <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-slate-900 border border-white/20 text-xs font-mono text-white">
                        <span
                          className="w-3.5 h-3.5 rounded-full border border-white"
                          style={{ backgroundColor: currentSlime.hexColor }}
                        />
                        HEX: {currentSlime.hexColor}
                      </span>
                      <span className="px-3 py-1 rounded-full bg-slate-900 border border-white/20 text-xs font-bold text-cyan-200">
                        {currentSlime.recipe?.base?.emoji} {currentSlime.recipe?.base?.name}
                      </span>
                    </div>
                  </div>

                  {/* 右側：AI 史萊姆圖鑑詳細資料卡 */}
                  <div className="lg:col-span-7 space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div>
                        <span className="text-xs font-bold text-fuchsia-300 tracking-wider uppercase">
                          Slime Pokedex Entry #{slimeHistory.length}
                        </span>
                        <h3 className="text-2xl md:text-3xl font-black text-white mt-0.5 flex items-center gap-2">
                          <span>✨ {currentSlime.slimeName}</span>
                        </h3>
                      </div>
                      <span className="text-xs text-slate-400 bg-slate-900/90 px-3 py-1.5 rounded-xl border border-white/10">
                        🕒 合成時間：{currentSlime.createdAt}
                      </span>
                    </div>

                    {/* 圖鑑三大核心屬性 (appearance, texture, specialBehavior) */}
                    <div className="grid grid-cols-1 gap-3.5">
                      <div className="p-4 rounded-2xl bg-slate-950/70 border border-cyan-500/30">
                        <div className="text-xs font-black text-cyan-300 mb-1 flex items-center gap-1.5">
                          <span>🎨</span> 外觀描述與色碼 (appearance)
                        </div>
                        <p className="text-sm md:text-base text-slate-100 leading-relaxed">
                          {currentSlime.appearance}
                        </p>
                      </div>

                      <div className="p-4 rounded-2xl bg-slate-950/70 border border-amber-500/30">
                        <div className="text-xs font-black text-amber-300 mb-1 flex items-center gap-1.5">
                          <span>🤚</span> 摸起來的觸感 (texture)
                        </div>
                        <p className="text-sm md:text-base text-slate-100 leading-relaxed">
                          {currentSlime.texture}
                        </p>
                      </div>

                      <div className="p-4 rounded-2xl bg-slate-950/70 border border-fuchsia-500/30">
                        <div className="text-xs font-black text-fuchsia-300 mb-1 flex items-center gap-1.5">
                          <span>⚡</span> 特殊行為報告 (specialBehavior)
                        </div>
                        <p className="text-sm md:text-base text-slate-100 leading-relaxed">
                          {currentSlime.specialBehavior}
                        </p>
                      </div>
                    </div>

                    {/* 合成此史萊姆的配方紀錄 */}
                    <div className="p-3.5 rounded-2xl bg-indigo-950/50 border border-indigo-400/25 flex flex-wrap items-center justify-between gap-2 text-xs">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="font-bold text-indigo-200">🧪 合成配方：</span>
                        <span className="px-2.5 py-1 rounded-lg bg-slate-900 text-cyan-200">
                          {currentSlime.recipe?.base?.emoji} {currentSlime.recipe?.base?.name}
                        </span>
                        <span className="px-2.5 py-1 rounded-lg bg-slate-900 text-fuchsia-200">
                          🎨 {currentSlime.recipe?.pigments?.length > 0
                            ? currentSlime.recipe.pigments.map(p => p.name).join('+')
                            : '無色素'}
                        </span>
                        <span className="px-2.5 py-1 rounded-lg bg-slate-900 text-amber-200">
                          ✨ {currentSlime.recipe?.additives?.length > 0
                            ? currentSlime.recipe.additives.map(a => a.name).join('、')
                            : '無添加物'}
                        </span>
                      </div>
                      <button
                        onClick={handlePokeSlime}
                        className="px-3 py-1.5 rounded-xl bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-black transition active:scale-95"
                      >
                        👉 捏一下史萊姆
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* 歷史合成圖鑑收藏櫃 */}
              {slimeHistory.length > 1 && (
                <div className="mt-8 pt-6 border-t border-white/10">
                  <h4 className="text-sm font-black text-slate-300 mb-3 flex items-center gap-2">
                    <span>🏆</span> 實驗室歷代合成圖鑑紀錄（點擊可切換檢視）
                  </h4>
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">
                    {slimeHistory.map(item => {
                      const active = currentSlime?.id === item.id;
                      return (
                        <button
                          key={item.id}
                          onClick={() => setCurrentSlime(item)}
                          className={`p-3 rounded-2xl border text-left transition flex items-center gap-2.5 ${
                            active
                              ? 'bg-white/15 border-fuchsia-400 shadow-lg'
                              : 'bg-slate-950/60 hover:bg-slate-900 border-white/10'
                          }`}
                        >
                          <div
                            className="w-8 h-8 rounded-full shrink-0 border-2 border-white shadow"
                            style={{ backgroundColor: item.hexColor }}
                          />
                          <div className="overflow-hidden">
                            <div className="text-xs font-black text-white truncate">{item.slimeName}</div>
                            <div className="text-[10px] text-slate-400 font-mono">{item.hexColor}</div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </section>
          </main>

          {/* API Key 設定彈窗 */}
          {showApiModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border-2 border-purple-400/50 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-black text-white flex items-center gap-2">
                    <span>🔑</span> Gemini API 金鑰設定
                  </h3>
                  <button
                    onClick={() => setShowApiModal(false)}
                    className="text-slate-400 hover:text-white text-xl font-bold"
                  >
                    ✕
                  </button>
                </div>
                <p className="text-xs text-slate-300 leading-relaxed">
                  目前已自動載入您的 Gemini API Key。您也可以在此更換或確認金鑰：
                </p>
                <input
                  type="text"
                  value={apiKey}
                  onChange={e => {
                    setApiKey(e.target.value);
                    localStorage.setItem('CRAZY_SLIME_GEMINI_KEY', e.target.value);
                  }}
                  placeholder="輸入 AIzaSy... 開頭的 Gemini API Key"
                  className="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-purple-500/40 text-sm font-mono text-emerald-300 focus:outline-none focus:border-fuchsia-400"
                />
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => {
                      setApiKey(DEFAULT_API_KEY);
                      localStorage.setItem('CRAZY_SLIME_GEMINI_KEY', DEFAULT_API_KEY);
                    }}
                    className="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300"
                  >
                    還原預設金鑰
                  </button>
                  <button
                    onClick={() => setShowApiModal(false)}
                    className="px-5 py-2 rounded-xl bg-gradient-to-r from-fuchsia-500 to-cyan-500 text-xs font-black text-white"
                  >
                    儲存並關閉
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CrazySlimeLabApp />);
  </script>
</body>
</html>
